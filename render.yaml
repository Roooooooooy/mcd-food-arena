# Optional configuration retained from the earlier public-hosting plan.
# Current delivery is local account mode; no Render signup or deployment is required.
services:
  - type: web
    name: mcd-food-arena
    runtime: node
    plan: free
    numInstances: 1
    region: singapore
    autoDeployTrigger: 'off'
    buildCommand: npm --userconfig=/dev/null ci --include=dev && npm --userconfig=/dev/null run build:commerce
    startCommand: npm --userconfig=/dev/null start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
# PORT and RENDER_EXTERNAL_URL are provided by Render.
# PUBLIC_ORIGIN may be set explicitly for a custom domain. No Token belongs here.
